<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPM Makine Bakım V6.0 — Giriş</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#075985);font-family:Segoe UI,Arial,sans-serif;color:#0f172a;padding:20px}.panel{background:white;border-radius:18px;max-width:470px;width:100%;padding:32px;text-align:center;box-shadow:0 20px 70px #0004}h1{font-size:25px;margin:14px 0}p{line-height:1.6;color:#475569}.button{display:block;background:#0284c7;color:#fff;text-decoration:none;padding:14px 20px;border-radius:9px;font-weight:700;margin:22px 0 12px}.hint{font-size:13px;color:#64748b}
</style>
<script>
(function () {
  'use strict';
  // Doğrudan yayımlanan uygulamanın dosyasına git; klasör köküne gitme.
  var appUrl = 'https://tpmveri.github.io/tpm-makine-bakim/index.html';
  window.addEventListener('DOMContentLoaded', function () {
    var link = document.getElementById('app-link');
    if (link) link.href = appUrl;
    window.setTimeout(function () { window.location.replace(appUrl); }, 700);
  });
})();
</script>
</head>
<body>
<main class="panel">
  <div style="font-size:38px" aria-hidden="true">⚙️</div>
  <h1>TPM Makine Bakım V6.0</h1>
  <p>Uygulamanın giriş ekranı açılıyor.</p>
  <a id="app-link" class="button" href="https://tpmveri.github.io/tpm-makine-bakim/index.html">Uygulamayı Aç</a>
  <p class="hint">Otomatik yönlendirme gerçekleşmezse düğmeye basın.</p>
</main>
</body>
</html>
